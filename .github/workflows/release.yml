name: Build & Release APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Needed to create releases and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25' # Matches project toolchain

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Keystore secret detected. Building Release APK..."
            ./gradlew assembleRelease
          else
            echo "No keystore secret detected. Building Debug APK..."
            ./gradlew assembleDebug
          fi

      - name: Sign Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Package & Rename APK
        id: prepare_apk
        run: |
          if [ -n "${{ steps.sign_apk.outputs.signedFile }}" ]; then
            APK_FILE="${{ steps.sign_apk.outputs.signedFile }}"
          else
            APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found!"
            exit 1
          fi

          # Determine version from tag or run number
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi

          RELEASE_NAME="MorpheBuilds-v${VERSION}.apk"
          cp "$APK_FILE" "$RELEASE_NAME"

          echo "apk_path=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.prepare_apk.outputs.version }}"
          name: "MorpheBuilds v${{ steps.prepare_apk.outputs.version }}"
          body: |
            ## Automated Release v${{ steps.prepare_apk.outputs.version }}
            - **Commit**: ${{ github.sha }}
            - **Triggered by**: @${{ github.actor }}

            ### Installation
            Download the signed APK attached below and install it directly on your Android device.
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
