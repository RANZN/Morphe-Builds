name: Build & Release APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Needed to create releases and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25' # Matches your project's gradle toolchain

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Package & Rename APK
        id: prepare_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          
          # Creates version like 1.0.12 (using GitHub run number)
          VERSION="1.0.${{ github.run_number }}"
          RELEASE_NAME="MorpheBuilds-v${VERSION}.apk"
          cp "$APK_FILE" "$RELEASE_NAME"
          
          echo "apk_path=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.prepare_apk.outputs.version }}"
          name: "MorpheBuilds v${{ steps.prepare_apk.outputs.version }}"
          body: |
            ## Automated Release
            - **Commit**: ${{ github.sha }}
            - **Merged by**: @${{ github.actor }}
            
            ### Installation
            Download the APK attached below and install it directly on your Android device.
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
